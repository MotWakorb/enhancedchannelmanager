      - Migrate to a New Install: user_guide/backup-restore/migrate-to-a-new-install.md
      - Troubleshoot a Restore: user_guide/backup-restore/troubleshoot-restore.md
  - Notifications & Alerts: user_guide/notifications/index.md
  - Integrations:
