site_name: Enhanced Channel Manager — User Guide
site_description: Operator and end-user documentation for ECM (Enhanced Channel Manager).
site_url: https://motwakorb.github.io/enhancedchannelmanager/
repo_url: https://github.com/MotWakorb/enhancedchannelmanager
repo_name: MotWakorb/enhancedchannelmanager
edit_uri: edit/dev/docs/

docs_dir: docs

# Publish ONLY the user-facing guide. Developer/internal docs (architecture,
# ADRs, security threat models, SRE, runbooks, shipping, testing, commands) are
# deliberately kept OUT of the public site per COMPONENTS.md (docs tier note).
# New top-level *.md files are auto-excluded by /*.md; if a new INTERNAL
# top-level directory is ever added under docs/, add it to this list too.
exclude_docs: |
  /*.md
  !/index.md
  /adr/
  /commands/
  /design/
  /runbooks/
  /security/
  /sre/
  /testing/
  /user_guide/README.md
  /requirements-docs.txt

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

