services:
  # MCP server — exposes ECM tools for Claude Desktop/Code over the
  # Streamable HTTP transport (single /mcp endpoint on port 6101).
  ecm-mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      # Secure default: MCP is reachable only from this Docker host. Use the
      # explicit remote overlay behind an HTTPS reverse proxy for LAN clients.
      - "127.0.0.1:${MCP_PORT:-6101}:${MCP_PORT:-6101}"
    volumes:
      - ecm-config:/config:ro
    # Match ECM's runtime identity. The backend creates the private service
    # projection as owner-only (0600), and the sidecar rejects other owners.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - CONFIG_DIR=/config
      - ECM_URL=http://ecm:${ECM_PORT:-6100}
      - MCP_PORT=${MCP_PORT:-6101}
      - MCP_BIND_ADDRESS=0.0.0.0
      # Comma-separated LAN hostnames/IPs clients use for this sidecar.
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
    depends_on:
      ecm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ecm-config:
