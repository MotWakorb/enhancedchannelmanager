name: Build and Push Docker Image

# ─── ONE SOURCE OF TRUTH PER REQUIRED CONTEXT (bead enhancedchannelmanager-5rwzy) ──
#
# This workflow owns two of the four required status checks on `dev`:
# `CodeQL Analysis (python)` and `CodeQL Analysis (javascript-typescript)`,
# both from the `codeql-analysis` matrix below. The other two, `Backend
# Tests` and `Frontend Tests`, come from test.yml.
#
# The path filter that used to sit here is gone for the reason spelled out at
# the top of test.yml: `docs-only-pass.yml` mirrored these two names to fill
# the gap on Markdown-only changes, and its `paths:` filter was not the
# complement of this `paths-ignore`, so a PR touching code AND Markdown got
# two check-runs per required context, one of them a permanently green echo.
#
# So `codeql-analysis` now runs on every event and gates its expensive steps
# on the `detect` job. Image verification is independent of Tests; only the
# exact-SHA publication workflow joins their authoritative results.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Changed-path classifier ──────────────────────────────────────────
  # Mirrors test.yml's `detect` job. Both call the same classifier script,
  # scripts/classify_changed_paths.py, so the inert-path rule has
  # exactly one definition. As there, the gate is written `!= 'false'` so an
  # empty or missing output runs the real work.
  detect:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_paths_changed: ${{ steps.classify.outputs.code_paths_changed }}
      docs_site_affected: ${{ steps.classify.outputs.docs_site_affected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Classify the changed file set
        id: classify
        uses: ./.github/actions/classify-changed-paths

  # ADR-001 input classifier. This is separate from the broad code-path
  # classifier because dependency/image manifests trigger more expensive
  # pre-merge SCA, DAST, and container gates on PRs targeting dev.
  detect-dependency-change:
    name: Detect Dependency Changes
    runs-on: ubuntu-latest
    outputs:
      dependency_files_changed: ${{ steps.classify.outputs.dependency_files_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Classify dependency inputs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" > dependency-paths.nul; then
              echo "::warning::could not acquire PR diff; dependency gates will run"
              : > dependency-paths.nul
            fi
          elif [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$BEFORE_SHA^{commit}" \
            && git cat-file -e "$HEAD_SHA^{commit}"; then
            if ! git diff --name-only --no-renames -z "$BEFORE_SHA" "$HEAD_SHA" > dependency-paths.nul; then
              echo "::warning::could not acquire push diff; dependency gates will run"
              : > dependency-paths.nul
            fi
          else
            echo "::warning::missing exact push range; dependency gates will run"
            : > dependency-paths.nul
          fi
          python scripts/dependency_change_policy.py dependency-paths.nul >> "$GITHUB_OUTPUT"

  # Security scanning jobs - run on pushes to main and PRs to main
  # NOT a required context, so it may skip at the job level. The
  # `code_paths_changed` clause keeps the pre-5rwzy behaviour: before this workflow
  # ran on every event, a Markdown-only PR to main never reached npm audit,
  # and a fresh advisory should not block a typo fix.
  security-scan-frontend:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    needs: [detect, detect-dependency-change]
    if: >-
      needs.detect.outputs.code_paths_changed != 'false'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/dev'
      && needs.detect-dependency-change.outputs.dependency_files_changed == 'true')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'pull_request' && github.base_ref == 'dev'
      && needs.detect-dependency-change.outputs.dependency_files_changed == 'true'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  # NOT a required context; may skip at the job level (see above).
  security-scan-backend:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: [detect, detect-dependency-change]
    if: >-
      needs.detect.outputs.code_paths_changed != 'false'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/dev'
      && needs.detect-dependency-change.outputs.dependency_files_changed == 'true')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'pull_request' && github.base_ref == 'dev'
      && needs.detect-dependency-change.outputs.dependency_files_changed == 'true'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        # PYSEC-2024-48: aiohttp (no fix available for our version range)
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-48

  # MCP dependencies are a publication gate on dev and main as well as a
  # pre-merge signal. Unlike the legacy backend scan above, this job cannot
  # skip on dev: both MCP image builders require it before pushing a digest.
  security-scan-mcp:
    name: MCP Dependency Security Scan
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned pip-audit
        run: python -m pip install pip-audit==2.10.0

      - name: Audit MCP dependencies
        run: pip-audit -r mcp-server/requirements.txt

      - name: Prove MCP dependency audit fails closed
        run: |
          set +e
          audit_output=$(pip-audit -r backend/tests/fixtures/mcp_vulnerable_requirements.txt 2>&1)
          audit_status=$?
          set -e
          echo "$audit_output"
          if [ "$audit_status" -eq 0 ]; then
            echo "::error::pip-audit accepted the deliberately vulnerable MCP fixture"
            exit 1
          fi
          if ! grep -Eq '^starlette[[:space:]]+0\.27\.0[[:space:]]+[^[:space:]]+' <<< "$audit_output"; then
            echo "::error::pip-audit failed without reporting the fixture's Starlette advisories"
            exit 1
          fi

      - name: Verify MCP publication policy
        run: python scripts/check_mcp_supply_chain.py

  # REQUIRED CONTEXTS: the matrix expands this job's name into
  # `CodeQL Analysis (python)` and `CodeQL Analysis (javascript-typescript)`.
  # It must therefore run on every event so each name is emitted exactly
  # once, and gate its steps rather than itself. `!cancelled()` is there so a
  # `detect` failure cannot skip the job: a skipped job counts as a satisfied
  # required check, which is the hole this whole change closes.
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [detect]
    if: >-
      !cancelled()
      && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
      || (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev')))
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      # Only explicitly inert machine state can reach this no-op. Every
      # Markdown path runs CodeQL with the rest of the required gates.
      - name: Inert-only change, no code to analyse
        if: needs.detect.outputs.code_paths_changed == 'false'
        run: |
          echo "Every changed path is on the classifier's explicit inert allowlist."
          echo "CodeQL has no changed ${{ matrix.language }} source to scan,"
          echo "so this check passes without running the analysis."
          # The check name is the same whether the analysis ran or not. Say
          # which happened in the run summary so the rollup is readable
          # without opening the job log. See bead enhancedchannelmanager-t4d5w.
          echo "**CodeQL Analysis (${{ matrix.language }})**: inert machine-state change, the analysis and delta-zero alert gate were NOT run." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: needs.detect.outputs.code_paths_changed != 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        if: needs.detect.outputs.code_paths_changed != 'false'
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        if: needs.detect.outputs.code_paths_changed != 'false'
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4

      - name: Perform CodeQL Analysis
        id: analyze
        if: needs.detect.outputs.code_paths_changed != 'false'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"

      # ADR-005 Phase 3b: delta-zero enforcement.
      # Fails the job on any PR that has open HIGH/CRITICAL CodeQL alerts.
      # PR-only — push events are post-merge scans of already-reviewed code
      # and gating them would block everyone on transient alerts.
      # Code Scanning "merge protection rules" aren't available for our custom
      # CodeQL setup, so we enforce delta-zero in the workflow itself and
      # make this job a required status check.
      - name: Enforce CodeQL delta-zero (fail on open HIGH/CRITICAL)
        id: delta_zero
        if: needs.detect.outputs.code_paths_changed != 'false' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail

          # Code Scanning alerts API requires the PR merge ref form for
          # PR-scoped queries — raw SHA or refs/heads/<branch> returns 0
          # even when alerts exist. See:
          # https://docs.github.com/en/rest/code-scanning/code-scanning#list-code-scanning-alerts-for-a-repository
          REF="refs/pull/${PR_NUMBER}/merge"
          echo "Checking CodeQL alerts on ref=$REF (PR #${PR_NUMBER}, language=${LANGUAGE})"

          # Two sources of eventual-consistency between codeql-action/analyze
          # and the alerts view:
          #  (1) On a NEW PR, after the first scan: alerts-API lags the
          #      analyses endpoint. Poll for them to appear.
          #  (2) On a SUBSEQUENT push that FIXES alerts: alerts-API keeps
          #      returning stale alerts from the prior scan. These stale
          #      alerts carry a `most_recent_instance.commit_sha` that
          #      points to the PREVIOUS merge commit, not the current one.
          #
          # Solution: pin on the latest analysis commit_sha from the
          # analyses endpoint (which updates instantly on SARIF upload),
          # then filter alerts to only those whose
          # `most_recent_instance.commit_sha` matches that pin. Stale
          # alerts from prior scans are ignored; new alerts are trusted
          # only once the analysis pin is current.
          #
          # Poll schedule: up to 6 attempts at 10/20/30/45/60/60s waits
          # (~4min total). Break early as soon as analyses on the CURRENT
          # merge commit exist for our language (proof the API has caught
          # up) AND we can filter alerts to that commit.
          ATTEMPTS=6
          WAITS=(10 20 30 45 60 60)
          CURRENT_SHA=""
          PINNED_ALERTS='[]'

          CURRENT_RESULTS_COUNT=""
          for i in $(seq 0 $((ATTEMPTS - 1))); do
            ATTEMPT_NUM=$((i + 1))
            echo "Attempt ${ATTEMPT_NUM}/${ATTEMPTS}: checking analyses for ref=$REF, language=${LANGUAGE}"

            # Fetch the latest analysis for THIS language on this PR ref.
            # The analyses endpoint reflects SARIF uploads immediately —
            # unlike the alerts endpoint, which takes additional time to
            # update its ref-scoped view. Pinning to this commit_sha lets
            # us ignore stale alerts from prior scans.
            LATEST=$(gh api \
              "/repos/${{ github.repository }}/code-scanning/analyses?ref=${REF}&per_page=20" \
              | jq --arg lang "/language:${LANGUAGE}" \
                  '[.[] | select(.category==$lang)] | sort_by(.created_at) | reverse | .[0] // null')

            if [ "${LATEST}" != "null" ] && [ -n "${LATEST}" ]; then
              CURRENT_SHA=$(echo "${LATEST}" | jq -r '.commit_sha')
              CREATED_AT=$(echo "${LATEST}" | jq -r '.created_at')
              CURRENT_RESULTS_COUNT=$(echo "${LATEST}" | jq -r '.results_count')
              echo "  -> latest analysis for ${LANGUAGE}: commit=${CURRENT_SHA:0:10} created=${CREATED_AT} results=${CURRENT_RESULTS_COUNT}"
              echo "  -> analysis pin acquired; proceeding to alert check"
              break
            fi

            echo "  -> no analyses found yet for ${LANGUAGE}"

            if [ "${ATTEMPT_NUM}" -lt "${ATTEMPTS}" ]; then
              WAIT=${WAITS[$i]}
              echo "  -> sleeping ${WAIT}s before retry"
              sleep "${WAIT}"
            fi
          done

          if [ -z "${CURRENT_SHA}" ]; then
            echo "::error::Could not acquire a CodeQL analysis pin for language=${LANGUAGE} on ref=${REF} after ~4min. SARIF upload did not register. Failing closed."
            exit 1
          fi

          # Fast-path: if the analysis itself reports zero findings for
          # this commit, the scan was clean — no need to poll the alerts
          # endpoint (which could still be showing stale alerts from
          # prior scans).
          if [ "${CURRENT_RESULTS_COUNT}" = "0" ]; then
            echo "Delta-zero check passed: analysis on ${CURRENT_SHA:0:10} (${LANGUAGE}) reports 0 findings"
            exit 0
          fi

          # The analysis reported >0 findings. Now we need to check
          # severity. Poll the alerts endpoint filtered to alerts whose
          # most_recent_instance.commit_sha matches our pinned SHA.
          # Stale alerts (from prior scans on different commits) are
          # excluded automatically. On a fresh scan, alerts may lag the
          # analyses endpoint by ~30-60s before appearing.
          ALERT_ATTEMPTS=4
          ALERT_WAITS=(10 20 30 45)
          PINNED_ALERTS='[]'
          for j in $(seq 0 $((ALERT_ATTEMPTS - 1))); do
            A_NUM=$((j + 1))
            echo "Alert poll ${A_NUM}/${ALERT_ATTEMPTS}: querying alerts on ref=${REF} pinned to ${CURRENT_SHA:0:10}"
            RAW=$(gh api --paginate \
              "/repos/${{ github.repository }}/code-scanning/alerts?state=open&ref=${REF}&per_page=100" \
              | jq -s 'add // []')

            TOTAL_RAW=$(echo "$RAW" | jq 'length')
            PINNED_ALERTS=$(echo "$RAW" | jq --arg sha "${CURRENT_SHA}" \
              '[.[] | select(.most_recent_instance.commit_sha == $sha)]')
            PINNED_COUNT=$(echo "$PINNED_ALERTS" | jq 'length')

            echo "  -> alerts on ref: ${TOTAL_RAW} raw, ${PINNED_COUNT} pinned to current SHA"

            # We expect at least some pinned alerts because the analysis
            # said results_count > 0. Break as soon as they appear.
            if [ "${PINNED_COUNT}" -gt 0 ]; then
              echo "  -> pinned alerts visible; decision can be made"
              break
            fi

            if [ "${A_NUM}" -lt "${ALERT_ATTEMPTS}" ]; then
              WAIT=${ALERT_WAITS[$j]}
              echo "  -> zero pinned alerts despite analysis reporting ${CURRENT_RESULTS_COUNT}; sleeping ${WAIT}s"
              sleep "${WAIT}"
            fi
          done

          # Apply the HIGH/CRITICAL filter to pinned alerts only.
          HIGH_ALERTS=$(echo "$PINNED_ALERTS" | jq \
            '[.[] | select(.rule.security_severity_level=="high" or .rule.security_severity_level=="critical") | {number, rule: .rule.id, path: .most_recent_instance.location.path, severity: .rule.security_severity_level}]')
          HIGH_COUNT=$(echo "$HIGH_ALERTS" | jq 'length')

          echo "Final (language=${LANGUAGE}, pinned to commit ${CURRENT_SHA:0:10}): ${HIGH_COUNT} open HIGH/CRITICAL alerts"

          if [ "${HIGH_COUNT}" -gt 0 ]; then
            echo "::error::${HIGH_COUNT} open HIGH/CRITICAL CodeQL alerts on this PR:"
            echo "$HIGH_ALERTS" | jq -r '.[] | "- alert #\(.number) [\(.severity)] \(.rule) at \(.path)"'
            echo ""
            echo "Per ADR-005 Phase 1 dismissal policy, these must be either:"
            echo "  (a) remediated (the fix closes the finding)"
            echo "  (b) dismissed as false-positive with sanitizer evidence + test reference"
            echo "  (c) dismissed as test-only with test path reference"
            echo "See docs/adr/ADR-005-code-security-gating-strategy.md for full policy."
            exit 1
          fi

          echo "Delta-zero check passed: 0 open HIGH/CRITICAL alerts on ref=$REF (language=${LANGUAGE})"

      # Separate step because the delta-zero script above exits early on its
      # clean fast path, so a trailing line inside it would not always run.
      - name: Summarize what this check did
        # A run summary must never be the reason a required check reports
        # red. If this step breaks, the conclusion the check is named for
        # still stands.
        continue-on-error: true
        if: always() && needs.detect.outputs.code_paths_changed != 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          LANGUAGE: ${{ matrix.language }}
          ANALYZE: ${{ steps.analyze.outcome }}
          DELTA_ZERO: ${{ steps.delta_zero.outcome }}
        run: |
          # A failed analysis stops the delta-zero gate from running at all,
          # so each half reports its own outcome instead of one line claiming
          # both happened.
          {
            echo "**CodeQL Analysis (${LANGUAGE})**:"
            echo "- security-and-quality analysis: ${ANALYZE:-did not run}"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "- delta-zero HIGH/CRITICAL alert gate: ${DELTA_ZERO:-did not run}"
            else
              echo "- delta-zero alert gate: pull-request-only, does not apply to this event"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Each architecture is built once into an OCI archive. Verification jobs
  # consume that exact archive; publication later promotes it without rebuilding.
  build-amd64:
    name: Build Docker Image (AMD64)
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false'
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - id: version
        run: |
          echo "version=$(jq -r '.version' frontend/package.json)" >> "$GITHUB_OUTPUT"
          test "${{ github.ref }}" = refs/heads/dev && channel=dev || channel=latest
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Build immutable ECM AMD64 candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/ecm-amd64.oci.tar
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ECM_VERSION=${{ steps.version.outputs.version }}
            RELEASE_CHANNEL=${{ steps.version.outputs.channel }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Capture non-empty OCI manifest digest
        id: digest
        run: echo "digest=$(python scripts/candidate_image.py digest /tmp/ecm-amd64.oci.tar)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecm-amd64-candidate
          path: /tmp/ecm-amd64.oci.tar
          retention-days: 1
          if-no-files-found: error

  build-arm64:
    name: Build Docker Image (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false'
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - id: version
        run: |
          echo "version=$(jq -r '.version' frontend/package.json)" >> "$GITHUB_OUTPUT"
          test "${{ github.ref }}" = refs/heads/dev && channel=dev || channel=latest
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Build immutable ECM ARM64 candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=oci,dest=/tmp/ecm-arm64.oci.tar
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ECM_VERSION=${{ steps.version.outputs.version }}
            RELEASE_CHANNEL=${{ steps.version.outputs.channel }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
      - name: Capture non-empty OCI manifest digest
        id: digest
        run: echo "digest=$(python scripts/candidate_image.py digest /tmp/ecm-arm64.oci.tar)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ecm-arm64-candidate
          path: /tmp/ecm-arm64.oci.tar
          retention-days: 1
          if-no-files-found: error

  build-mcp-amd64:
    name: Build MCP Image (AMD64)
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false'
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build immutable MCP AMD64 candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./mcp-server
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/mcp-amd64.oci.tar
          cache-from: type=gha,scope=mcp-amd64
          cache-to: type=gha,mode=max,scope=mcp-amd64
      - name: Capture non-empty OCI manifest digest
        id: digest
        run: echo "digest=$(python scripts/candidate_image.py digest /tmp/mcp-amd64.oci.tar)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-amd64-candidate
          path: /tmp/mcp-amd64.oci.tar
          retention-days: 1
          if-no-files-found: error

  build-mcp-arm64:
    name: Build MCP Image (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false'
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build immutable MCP ARM64 candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./mcp-server
          platforms: linux/arm64
          outputs: type=oci,dest=/tmp/mcp-arm64.oci.tar
          cache-from: type=gha,scope=mcp-arm64
          cache-to: type=gha,mode=max,scope=mcp-arm64
      - name: Capture non-empty OCI manifest digest
        id: digest
        run: echo "digest=$(python scripts/candidate_image.py digest /tmp/mcp-arm64.oci.tar)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-arm64-candidate
          path: /tmp/mcp-arm64.oci.tar
          retention-days: 1
          if-no-files-found: error

  # ECM candidate scans, one per architecture. The two jobs are deliberate
  # mirror images of each other: same Trivy action pin, same
  # `exit-code: '1'`, same `ignore-unfixed: true`, same
  # `severity: 'CRITICAL,HIGH'`, each reading only the OCI archive its own
  # build job produced. Change one and change the other, or one
  # architecture publishes on a weaker bar than its twin.
  #
  # This is enforced, not merely asked for: `scripts/check_mcp_supply_chain.py`
  # requires four scans carrying `exit-code: '1'` and `severity:
  # 'CRITICAL,HIGH'`, and `attest-image-candidates` below needs all four,
  # so dropping or weakening one fails `Backend Tests` and stops publication.
  trivy-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-24.04
    needs: [build-amd64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ecm-amd64-candidate
          path: /tmp
      - name: Verify exact candidate identity
        run: |
          python scripts/candidate_image.py verify-archive /tmp/ecm-amd64.oci.tar --expected '${{ needs.build-amd64.outputs.digest }}'
          test "$(skopeo --version)" = "skopeo version 1.13.3"
          skopeo copy oci-archive:/tmp/ecm-amd64.oci.tar docker-archive:/tmp/trivy-ecm-amd64-scan.docker.tar
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/trivy-ecm-amd64-scan.docker.tar
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: 'CRITICAL,HIGH'

  trivy-scan-arm64:
    name: Container Security Scan (Trivy ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [build-arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ecm-arm64-candidate
          path: /tmp
      - name: Verify exact candidate identity
        run: |
          python scripts/candidate_image.py verify-archive /tmp/ecm-arm64.oci.tar --expected '${{ needs.build-arm64.outputs.digest }}'
          test "$(skopeo --version)" = "skopeo version 1.13.3"
          skopeo copy oci-archive:/tmp/ecm-arm64.oci.tar docker-archive:/tmp/trivy-ecm-arm64-scan.docker.tar
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/trivy-ecm-arm64-scan.docker.tar
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: 'CRITICAL,HIGH'

  trivy-scan-mcp-amd64:
    name: MCP Container Security Scan (Trivy AMD64)
    runs-on: ubuntu-24.04
    needs: [build-mcp-amd64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mcp-amd64-candidate
          path: /tmp
      - run: |
          python scripts/candidate_image.py verify-archive /tmp/mcp-amd64.oci.tar --expected '${{ needs.build-mcp-amd64.outputs.digest }}'
          test "$(skopeo --version)" = "skopeo version 1.13.3"
          skopeo copy oci-archive:/tmp/mcp-amd64.oci.tar docker-archive:/tmp/trivy-mcp-amd64-scan.docker.tar
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/trivy-mcp-amd64-scan.docker.tar
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: 'CRITICAL,HIGH'

  trivy-scan-mcp-arm64:
    name: MCP Container Security Scan (Trivy ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [build-mcp-arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: mcp-arm64-candidate
          path: /tmp
      - run: |
          python scripts/candidate_image.py verify-archive /tmp/mcp-arm64.oci.tar --expected '${{ needs.build-mcp-arm64.outputs.digest }}'
          test "$(skopeo --version)" = "skopeo version 1.13.3"
          skopeo copy oci-archive:/tmp/mcp-arm64.oci.tar docker-archive:/tmp/trivy-mcp-arm64-scan.docker.tar
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/trivy-mcp-arm64-scan.docker.tar
          format: table
          exit-code: '1'
          vuln-type: os,library
          severity: 'CRITICAL,HIGH'

  attest-image-candidates:
    name: Attest Verified Image Candidates
    runs-on: ubuntu-latest
    needs:
      - detect-dependency-change
      - security-scan-frontend
      - security-scan-backend
      - security-scan-mcp
      - build-amd64
      - build-arm64
      - build-mcp-amd64
      - build-mcp-arm64
      - trivy-scan
      - trivy-scan-arm64
      - trivy-scan-mcp-amd64
      - trivy-scan-mcp-arm64
    if: >-
      always() && github.event_name == 'push'
      && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
      && needs.build-amd64.result == 'success'
      && needs.build-arm64.result == 'success'
      && needs.build-mcp-amd64.result == 'success'
      && needs.build-mcp-arm64.result == 'success'
      && needs.trivy-scan.result == 'success'
      && needs.trivy-scan-arm64.result == 'success'
      && needs.trivy-scan-mcp-amd64.result == 'success'
      && needs.trivy-scan-mcp-arm64.result == 'success'
      && needs.security-scan-mcp.result == 'success'
    steps:
      - name: Bind digests and per-SHA SCA evidence
        env:
          DEPENDENCY_CHANGE: ${{ needs.detect-dependency-change.outputs.dependency_files_changed }}
          FRONTEND_SCA: ${{ needs.security-scan-frontend.result }}
          BACKEND_SCA: ${{ needs.security-scan-backend.result }}
        run: |
          set -euo pipefail
          if test "$DEPENDENCY_CHANGE" = true; then
            test "$FRONTEND_SCA" = success
            test "$BACKEND_SCA" = success
          elif test "$DEPENDENCY_CHANGE" != false; then
            echo "::error::Missing dependency-change verdict"
            exit 1
          fi
          jq -n \
            --arg sha '${{ github.sha }}' \
            --argjson run_id '${{ github.run_id }}' \
            --argjson dependency_change "$DEPENDENCY_CHANGE" \
            --arg frontend_sca "$FRONTEND_SCA" \
            --arg backend_sca "$BACKEND_SCA" \
            --arg ecm_amd64 '${{ needs.build-amd64.outputs.digest }}' \
            --arg ecm_arm64 '${{ needs.build-arm64.outputs.digest }}' \
            --arg mcp_amd64 '${{ needs.build-mcp-amd64.outputs.digest }}' \
            --arg mcp_arm64 '${{ needs.build-mcp-arm64.outputs.digest }}' \
            '{sha:$sha,build_run_id:$run_id,dependency_change:$dependency_change,
              frontend_sca:$frontend_sca,backend_sca:$backend_sca,
              digests:{ecm_amd64:$ecm_amd64,ecm_arm64:$ecm_arm64,
                       mcp_amd64:$mcp_amd64,mcp_arm64:$mcp_arm64}}' > candidate-attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-image-candidates
          path: candidate-attestation.json
          retention-days: 1
          if-no-files-found: error
