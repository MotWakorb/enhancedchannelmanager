name: Build and Push Docker Image

# ─── ONE SOURCE OF TRUTH PER REQUIRED CONTEXT (bead enhancedchannelmanager-5rwzy) ──
#
# This workflow owns two of the eight required status checks:
# `CodeQL Analysis (python)` and `CodeQL Analysis (javascript-typescript)`,
# both from the `codeql-analysis` matrix below.
#
# The path filter that used to sit here is gone for the reason spelled out at
# the top of test.yml: `docs-only-pass.yml` mirrored these two names to fill
# the gap on Markdown-only changes, and its `paths:` filter was not the
# complement of this `paths-ignore`, so a PR touching code AND Markdown got
# two check-runs per required context, one of them a permanently green echo.
#
# So `codeql-analysis` now runs on every event and gates its expensive steps
# on the `detect` job. The image-build jobs are NOT required contexts and
# still have nothing to do on an inert machine-state change; they skip cleanly
# because `wait-for-tests` skips and they already require it to have
# succeeded.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Changed-path classifier ──────────────────────────────────────────
  # Mirrors test.yml's `detect` job. Both call the same classifier script,
  # scripts/classify_changed_paths.py, so the inert-path rule has
  # exactly one definition. As there, the gate is written `!= 'false'` so an
  # empty or missing output runs the real work.
  detect:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_paths_changed: ${{ steps.classify.outputs.code_paths_changed }}
      docs_site_affected: ${{ steps.classify.outputs.docs_site_affected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Classify the changed file set
        id: classify
        uses: ./.github/actions/classify-changed-paths

  # Security scanning jobs - run on pushes to main and PRs to main
  # NOT a required context, so it may skip at the job level. The
  # `code_paths_changed` clause keeps the pre-5rwzy behaviour: before this workflow
  # ran on every event, a Markdown-only PR to main never reached npm audit,
  # and a fresh advisory should not block a typo fix.
  security-scan-frontend:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  # NOT a required context; may skip at the job level (see above).
  security-scan-backend:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        # PYSEC-2024-48: aiohttp (no fix available for our version range)
        # CVE-2024-23342: ecdsa timing attack - transitive dep via python-jose,
        #   unused (cryptography backend handles actual signing), no fix planned
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-48 --ignore-vuln CVE-2024-23342

  # MCP dependencies are a publication gate on dev and main as well as a
  # pre-merge signal. Unlike the legacy backend scan above, this job cannot
  # skip on dev: both MCP image builders require it before pushing a digest.
  security-scan-mcp:
    name: MCP Dependency Security Scan
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned pip-audit
        run: python -m pip install pip-audit==2.10.0

      - name: Audit MCP dependencies
        run: pip-audit -r mcp-server/requirements.txt

      - name: Verify MCP publication policy
        run: python scripts/check_mcp_supply_chain.py

  # REQUIRED CONTEXTS: the matrix expands this job's name into
  # `CodeQL Analysis (python)` and `CodeQL Analysis (javascript-typescript)`.
  # It must therefore run on every event so each name is emitted exactly
  # once, and gate its steps rather than itself. `!cancelled()` is there so a
  # `detect` failure cannot skip the job: a skipped job counts as a satisfied
  # required check, which is the hole this whole change closes.
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [detect]
    if: >-
      !cancelled()
      && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
      || (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'dev')))
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      # Only explicitly inert machine state can reach this no-op. Every
      # Markdown path runs CodeQL with the rest of the required gates.
      - name: Inert-only change, no code to analyse
        if: needs.detect.outputs.code_paths_changed == 'false'
        run: |
          echo "Every changed path is on the classifier's explicit inert allowlist."
          echo "CodeQL has no changed ${{ matrix.language }} source to scan,"
          echo "so this check passes without running the analysis."
          # The check name is the same whether the analysis ran or not. Say
          # which happened in the run summary so the rollup is readable
          # without opening the job log. See bead enhancedchannelmanager-t4d5w.
          echo "**CodeQL Analysis (${{ matrix.language }})**: inert machine-state change, the analysis and delta-zero alert gate were NOT run." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: needs.detect.outputs.code_paths_changed != 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        if: needs.detect.outputs.code_paths_changed != 'false'
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        if: needs.detect.outputs.code_paths_changed != 'false'
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4

      - name: Perform CodeQL Analysis
        id: analyze
        if: needs.detect.outputs.code_paths_changed != 'false'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"

      # ADR-005 Phase 3b: delta-zero enforcement.
      # Fails the job on any PR that has open HIGH/CRITICAL CodeQL alerts.
      # PR-only — push events are post-merge scans of already-reviewed code
      # and gating them would block everyone on transient alerts.
      # Code Scanning "merge protection rules" aren't available for our custom
      # CodeQL setup, so we enforce delta-zero in the workflow itself and
      # make this job a required status check.
      - name: Enforce CodeQL delta-zero (fail on open HIGH/CRITICAL)
        id: delta_zero
        if: needs.detect.outputs.code_paths_changed != 'false' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail

          # Code Scanning alerts API requires the PR merge ref form for
          # PR-scoped queries — raw SHA or refs/heads/<branch> returns 0
          # even when alerts exist. See:
          # https://docs.github.com/en/rest/code-scanning/code-scanning#list-code-scanning-alerts-for-a-repository
          REF="refs/pull/${PR_NUMBER}/merge"
          echo "Checking CodeQL alerts on ref=$REF (PR #${PR_NUMBER}, language=${LANGUAGE})"

          # Two sources of eventual-consistency between codeql-action/analyze
          # and the alerts view:
          #  (1) On a NEW PR, after the first scan: alerts-API lags the
          #      analyses endpoint. Poll for them to appear.
          #  (2) On a SUBSEQUENT push that FIXES alerts: alerts-API keeps
          #      returning stale alerts from the prior scan. These stale
          #      alerts carry a `most_recent_instance.commit_sha` that
          #      points to the PREVIOUS merge commit, not the current one.
          #
          # Solution: pin on the latest analysis commit_sha from the
          # analyses endpoint (which updates instantly on SARIF upload),
          # then filter alerts to only those whose
          # `most_recent_instance.commit_sha` matches that pin. Stale
          # alerts from prior scans are ignored; new alerts are trusted
          # only once the analysis pin is current.
          #
          # Poll schedule: up to 6 attempts at 10/20/30/45/60/60s waits
          # (~4min total). Break early as soon as analyses on the CURRENT
          # merge commit exist for our language (proof the API has caught
          # up) AND we can filter alerts to that commit.
          ATTEMPTS=6
          WAITS=(10 20 30 45 60 60)
          CURRENT_SHA=""
          PINNED_ALERTS='[]'

          CURRENT_RESULTS_COUNT=""
          for i in $(seq 0 $((ATTEMPTS - 1))); do
            ATTEMPT_NUM=$((i + 1))
            echo "Attempt ${ATTEMPT_NUM}/${ATTEMPTS}: checking analyses for ref=$REF, language=${LANGUAGE}"

            # Fetch the latest analysis for THIS language on this PR ref.
            # The analyses endpoint reflects SARIF uploads immediately —
            # unlike the alerts endpoint, which takes additional time to
            # update its ref-scoped view. Pinning to this commit_sha lets
            # us ignore stale alerts from prior scans.
            LATEST=$(gh api \
              "/repos/${{ github.repository }}/code-scanning/analyses?ref=${REF}&per_page=20" \
              | jq --arg lang "/language:${LANGUAGE}" \
                  '[.[] | select(.category==$lang)] | sort_by(.created_at) | reverse | .[0] // null')

            if [ "${LATEST}" != "null" ] && [ -n "${LATEST}" ]; then
              CURRENT_SHA=$(echo "${LATEST}" | jq -r '.commit_sha')
              CREATED_AT=$(echo "${LATEST}" | jq -r '.created_at')
              CURRENT_RESULTS_COUNT=$(echo "${LATEST}" | jq -r '.results_count')
              echo "  -> latest analysis for ${LANGUAGE}: commit=${CURRENT_SHA:0:10} created=${CREATED_AT} results=${CURRENT_RESULTS_COUNT}"
              echo "  -> analysis pin acquired; proceeding to alert check"
              break
            fi

            echo "  -> no analyses found yet for ${LANGUAGE}"

            if [ "${ATTEMPT_NUM}" -lt "${ATTEMPTS}" ]; then
              WAIT=${WAITS[$i]}
              echo "  -> sleeping ${WAIT}s before retry"
              sleep "${WAIT}"
            fi
          done

          if [ -z "${CURRENT_SHA}" ]; then
            echo "::error::Could not acquire a CodeQL analysis pin for language=${LANGUAGE} on ref=${REF} after ~4min. SARIF upload did not register. Failing closed."
            exit 1
          fi

          # Fast-path: if the analysis itself reports zero findings for
          # this commit, the scan was clean — no need to poll the alerts
          # endpoint (which could still be showing stale alerts from
          # prior scans).
          if [ "${CURRENT_RESULTS_COUNT}" = "0" ]; then
            echo "Delta-zero check passed: analysis on ${CURRENT_SHA:0:10} (${LANGUAGE}) reports 0 findings"
            exit 0
          fi

          # The analysis reported >0 findings. Now we need to check
          # severity. Poll the alerts endpoint filtered to alerts whose
          # most_recent_instance.commit_sha matches our pinned SHA.
          # Stale alerts (from prior scans on different commits) are
          # excluded automatically. On a fresh scan, alerts may lag the
          # analyses endpoint by ~30-60s before appearing.
          ALERT_ATTEMPTS=4
          ALERT_WAITS=(10 20 30 45)
          PINNED_ALERTS='[]'
          for j in $(seq 0 $((ALERT_ATTEMPTS - 1))); do
            A_NUM=$((j + 1))
            echo "Alert poll ${A_NUM}/${ALERT_ATTEMPTS}: querying alerts on ref=${REF} pinned to ${CURRENT_SHA:0:10}"
            RAW=$(gh api --paginate \
              "/repos/${{ github.repository }}/code-scanning/alerts?state=open&ref=${REF}&per_page=100" \
              | jq -s 'add // []')

            TOTAL_RAW=$(echo "$RAW" | jq 'length')
            PINNED_ALERTS=$(echo "$RAW" | jq --arg sha "${CURRENT_SHA}" \
              '[.[] | select(.most_recent_instance.commit_sha == $sha)]')
            PINNED_COUNT=$(echo "$PINNED_ALERTS" | jq 'length')

            echo "  -> alerts on ref: ${TOTAL_RAW} raw, ${PINNED_COUNT} pinned to current SHA"

            # We expect at least some pinned alerts because the analysis
            # said results_count > 0. Break as soon as they appear.
            if [ "${PINNED_COUNT}" -gt 0 ]; then
              echo "  -> pinned alerts visible; decision can be made"
              break
            fi

            if [ "${A_NUM}" -lt "${ALERT_ATTEMPTS}" ]; then
              WAIT=${ALERT_WAITS[$j]}
              echo "  -> zero pinned alerts despite analysis reporting ${CURRENT_RESULTS_COUNT}; sleeping ${WAIT}s"
              sleep "${WAIT}"
            fi
          done

          # Apply the HIGH/CRITICAL filter to pinned alerts only.
          HIGH_ALERTS=$(echo "$PINNED_ALERTS" | jq \
            '[.[] | select(.rule.security_severity_level=="high" or .rule.security_severity_level=="critical") | {number, rule: .rule.id, path: .most_recent_instance.location.path, severity: .rule.security_severity_level}]')
          HIGH_COUNT=$(echo "$HIGH_ALERTS" | jq 'length')

          echo "Final (language=${LANGUAGE}, pinned to commit ${CURRENT_SHA:0:10}): ${HIGH_COUNT} open HIGH/CRITICAL alerts"

          if [ "${HIGH_COUNT}" -gt 0 ]; then
            echo "::error::${HIGH_COUNT} open HIGH/CRITICAL CodeQL alerts on this PR:"
            echo "$HIGH_ALERTS" | jq -r '.[] | "- alert #\(.number) [\(.severity)] \(.rule) at \(.path)"'
            echo ""
            echo "Per ADR-005 Phase 1 dismissal policy, these must be either:"
            echo "  (a) remediated (the fix closes the finding)"
            echo "  (b) dismissed as false-positive with sanitizer evidence + test reference"
            echo "  (c) dismissed as test-only with test path reference"
            echo "See docs/adr/ADR-005-code-security-gating-strategy.md for full policy."
            exit 1
          fi

          echo "Delta-zero check passed: 0 open HIGH/CRITICAL alerts on ref=$REF (language=${LANGUAGE})"

      # Separate step because the delta-zero script above exits early on its
      # clean fast path, so a trailing line inside it would not always run.
      - name: Summarize what this check did
        # A run summary must never be the reason a required check reports
        # red. If this step breaks, the conclusion the check is named for
        # still stands.
        continue-on-error: true
        if: always() && needs.detect.outputs.code_paths_changed != 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          LANGUAGE: ${{ matrix.language }}
          ANALYZE: ${{ steps.analyze.outcome }}
          DELTA_ZERO: ${{ steps.delta_zero.outcome }}
        run: |
          # A failed analysis stops the delta-zero gate from running at all,
          # so each half reports its own outcome instead of one line claiming
          # both happened.
          {
            echo "**CodeQL Analysis (${LANGUAGE})**:"
            echo "- security-and-quality analysis: ${ANALYZE:-did not run}"
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "- delta-zero HIGH/CRITICAL alert gate: ${DELTA_ZERO:-did not run}"
            else
              echo "- delta-zero alert gate: pull-request-only, does not apply to this event"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # IaC Security Scanning
  # NOT a required context; may skip at the job level (see security-scan-frontend).
  iac-security-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Checkov IaC scanner
        uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d # v12
        with:
          directory: .
          framework: dockerfile,github_actions
          soft_fail: false
          output_format: cli
          download_external_modules: false
          # Skip CKV2_GHA_1 - CodeQL requires security-events:write permission
          # Skip CKV_DOCKER_3 - We use gosu in entrypoint to drop to non-root user after fixing volume permissions
          # Skip CKV_DOCKER_8 - Same reason, entrypoint starts as root then switches to appuser
          # Skip CKV_GHA_7 - flake-pr-comment.yml's workflow_dispatch.inputs.pr_number is an
          #   intentional manual-run knob (which PR to re-post the flake comment on); it doesn't
          #   influence build output, only which PR a read-then-comment job targets.
          skip_check: CKV2_GHA_1,CKV_DOCKER_3,CKV_DOCKER_8,CKV_GHA_7

  # bd-ruzzg: gate every image build/push on test.yml's results for THIS
  # commit. test.yml is a separate workflow file — GitHub Actions has no
  # cross-workflow `needs:`, so without this job, build-amd64/build-arm64/
  # build-mcp-amd64/build-mcp-arm64 only depended on the security-scan jobs
  # above and would build (and, on a push to dev/main, PUSH to ghcr.io)
  # regardless of whether the backend/frontend/MCP test suites had finished
  # or passed on this exact commit. Polls the GitHub Checks API instead of
  # a cross-workflow trigger (workflow_run) or merging the two workflow
  # files — both of those would either complicate the required-status-check
  # setup or risk drifting the check names dev/main branch protection
  # depends on byte-for-byte.
  #
  # NOT a required context, so it may skip at the job level. Skipping it on a
  # inert machine-state change is what keeps the image builds off: every build
  # job requires `needs.wait-for-tests.result == 'success'`, and a skipped job
  # does not report success. Net effect matches the pre-5rwzy behaviour, where
  # this workflow did not run at all on an ignored-path change.
  wait-for-tests:
    name: Wait for Test Suite
    runs-on: ubuntu-latest
    needs: [detect]
    if: needs.detect.outputs.code_paths_changed != 'false'
    permissions:
      checks: read
    steps:
      - name: Poll test.yml check-runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PR events check the PR head SHA (github.sha on a pull_request
          # event is a synthetic merge commit, not the commit test.yml's
          # check-runs are actually posted against).
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # test.yml job display names that must all report success before
          # any image build proceeds. Keep in sync with the required-status-
          # check list in dev/main branch protection (docs/shipping.md §6).
          # Fake-Test Guard isn't a required check for merging, but it's a
          # real test-quality signal worth gating an image push on too.
          CHECKS=(
            "Backend Tests"
            "Frontend Tests"
            "MCP Server Tests"
            "Semgrep Lint"
            "Version Consistency"
            "Fake-Test Guard"
          )
          # 60 attempts * 30s = 30 minutes. Generous relative to observed suite
          # runtime (Backend Tests alone has taken 7m+) so a busy runner queue
          # or a cold dependency cache doesn't false-positive this into a
          # "failed" gate for image publishing.
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=30

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            # --paginate emits one JSON object per page (each {check_runs: [...]}
            # here); --jq '.check_runs' turns that into one array PER PAGE, and
            # the external `jq -s 'add // []'` slurps + flattens those into a
            # single combined array. Mirrors the codeql-analysis job's alert
            # pagination above (same object-shaped paginated-response pattern) —
            # if you're fixing a pagination bug here, check that job too.
            #
            # Deliberately NOT a bare assignment: `set -e` only exempts a
            # failing command when its status is tested directly (as in this
            # `if !`), so a transient gh api hiccup (5xx, secondary rate
            # limit) retries instead of hard-failing the whole gate.
            if ! runs_json=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs" --jq '.check_runs' \
              | jq -s 'add // []'); then
              echo "Transient error polling the Checks API (attempt $attempt/$MAX_ATTEMPTS) — retrying in ${SLEEP_SECONDS}s"
              sleep "$SLEEP_SECONDS"
              continue
            fi
            all_done=true

            for name in "${CHECKS[@]}"; do
              # As of bead enhancedchannelmanager-5rwzy each of these names
              # is emitted by exactly one job, so `matches` should hold a
              # single run. The loop still checks EVERY match rather than
              # the first one found: that is what caught the duplicate on
              # PR #797, where `Backend Tests` reported failure and success
              # on the same commit, and it is the cheapest possible detector
              # if a second emitter is ever reintroduced.
              matches=$(echo "$runs_json" | jq -c --arg n "$name" '[.[] | select(.name == $n)]')
              count=$(echo "$matches" | jq 'length')

              if [ "$count" -eq 0 ]; then
                echo "No check-run yet for '$name'"
                all_done=false
                continue
              fi

              incomplete=$(echo "$matches" | jq '[.[] | select(.status != "completed")] | length')
              if [ "$incomplete" -gt 0 ]; then
                echo "'$name' still running ($incomplete in progress)"
                all_done=false
                continue
              fi

              failed=$(echo "$matches" | jq '[.[] | select(.conclusion != "success")] | length')
              if [ "$failed" -gt 0 ]; then
                echo "::error::'$name' completed without success"
                echo "$matches" | jq '[.[] | {conclusion, html_url}]'
                exit 1
              fi

              echo "'$name' passed"
            done

            if [ "$all_done" = true ]; then
              echo "All test.yml checks passed for $SHA"
              exit 0
            fi

            echo "Waiting for test suite to finish (attempt $attempt/$MAX_ATTEMPTS)..."
            sleep "$SLEEP_SECONDS"
          done

          echo "::error::Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes waiting for test.yml checks to complete"
          exit 1

  # DAST - Dynamic Application Security Testing (loads image from build-amd64 cache)
  dast-scan:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: [build-amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Retry on transient registry timeouts pulling the buildkit builder image
      # (e.g. "net/http: request canceled while waiting for connection" against
      # registry-1.docker.io). See bd-n6197: run 30144328147 failed here on a
      # one-off Docker Hub blip while the build/push jobs on the same commit
      # succeeded. docker/setup-buildx-action has no built-in retry input, so
      # this duplicates the step with continue-on-error, matching the
      # build-push-action retry pattern used elsewhere in this file.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        continue-on-error: true

      - name: Wait before Buildx retry
        if: steps.buildx.outcome == 'failure'
        run: |
          echo "::warning::Docker Buildx setup failed (likely transient registry timeout pulling the buildkit image). Sleeping 15s before retry."
          sleep 15

      - name: Set up Docker Buildx — retry
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Extract version and set release channel
        id: version
        run: |
          VERSION=$(jq -r '.version' frontend/package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "channel=dev" >> $GITHUB_OUTPUT
          else
            echo "channel=latest" >> $GITHUB_OUTPUT
          fi

      - name: Load Docker image from build cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: ecm:dast-test
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ECM_VERSION=${{ steps.version.outputs.version }}
            RELEASE_CHANNEL=${{ steps.version.outputs.channel }}
          cache-from: type=gha,scope=amd64

      - name: Start application container
        run: |
          docker run -d --name ecm-dast -p 6100:6100 \
            -e DISPATCHARR_URL=http://localhost:9999 \
            ecm:dast-test

          # Wait for the app to be ready
          echo "Waiting for application to start..."
          READY=false
          for i in {1..30}; do
            if curl -sf http://localhost:6100/api/health > /dev/null 2>&1; then
              echo "✓ Application is ready!"
              READY=true
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

          # Fail if app never became ready
          if [ "$READY" = "false" ]; then
            echo "✗ Application failed to start within 60 seconds"
            echo "Container logs:"
            docker logs ecm-dast
            echo "Container status:"
            docker ps -a | grep ecm-dast
            exit 1
          fi

      - name: Verify application health
        run: |
          echo "Testing health endpoint..."
          HEALTH_RESPONSE=$(curl -s http://localhost:6100/api/health)
          echo "Health response: $HEALTH_RESPONSE"

          echo "Container status:"
          docker ps | grep ecm-dast

          echo "Recent container logs:"
          docker logs --tail 50 ecm-dast

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:6100'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          # fail_action: false means only actual FAIL alerts fail the build
          # WARN alerts are logged but don't fail (appropriate for informational security headers)
          fail_action: false

      - name: Show container logs and stop
        if: always()
        run: |
          echo "Final container logs:"
          docker logs ecm-dast || true
          echo "Stopping container..."
          docker stop ecm-dast || true
          docker rm ecm-dast || true

  # Build AMD64 image natively
  build-amd64:
    name: Build Docker Image (AMD64)
    runs-on: ubuntu-latest
    # On PRs to main, wait for security scans; on dev branch pushes, run immediately.
    # wait-for-tests (bd-ruzzg) is a HARD gate regardless of push vs PR — unlike the
    # security scans, a failed/incomplete test suite must never be waved through.
    needs: [security-scan-frontend, security-scan-backend, codeql-analysis, iac-security-scan, wait-for-tests]
    if: >-
      always() && needs.wait-for-tests.result == 'success'
      && (github.event_name != 'pull_request' || !contains(needs.*.result, 'failure'))
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Retry on transient registry timeouts pulling the buildkit builder image
      # (e.g. "net/http: request canceled while waiting for connection" against
      # registry-1.docker.io). See bd-n6197: run 30144328147 failed here on a
      # one-off Docker Hub blip while the build/push jobs on the same commit
      # succeeded. docker/setup-buildx-action has no built-in retry input, so
      # this duplicates the step with continue-on-error, matching the
      # build-push-action retry pattern used elsewhere in this file.
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        continue-on-error: true

      - name: Wait before Buildx retry
        if: steps.buildx.outcome == 'failure'
        run: |
          echo "::warning::Docker Buildx setup failed (likely transient registry timeout pulling the buildkit image). Sleeping 15s before retry."
          sleep 15

      - name: Set up Docker Buildx — retry
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Retry on transient registry-connect timeouts (bd-n6197), mirroring the
      # Buildx-setup retry above and the build-push-action retry pattern.
      - name: Log in to Container Registry
        id: login
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait before registry login retry
        if: github.event_name != 'pull_request' && steps.login.outcome == 'failure'
        run: |
          echo "::warning::Container registry login failed (likely transient network timeout). Sleeping 15s before retry."
          sleep 15

      - name: Log in to Container Registry — retry
        if: github.event_name != 'pull_request' && steps.login.outcome == 'failure'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}

      - name: Extract version and set release channel
        id: version
        run: |
          VERSION=$(jq -r '.version' frontend/package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "channel=dev" >> $GITHUB_OUTPUT
          else
            echo "channel=latest" >> $GITHUB_OUTPUT
          fi

      # Build + push with 2 retries on transient GHCR 50x during layer blob push.
      # See bd-42aai: GHCR returned 502/504 with
      # "error writing layer blob: failed to parse error response 50x" in a
      # 30min window across 4 jobs, each needing manual rerun. Retries are
      # scoped to this step only; build cache is reused across attempts.
      - name: Build and push (AMD64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        continue-on-error: true
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ECM_VERSION=${{ steps.version.outputs.version }}
            RELEASE_CHANNEL=${{ steps.version.outputs.channel }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Wait before retry 1 (AMD64)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::Build/push attempt 1 failed (likely transient GHCR 50x). Sleeping 30s before retry."
          sleep 30

      - name: Build and push (AMD64) — retry 1
        id: build_retry1
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        continue-on-error: true
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ECM_VERSION=${{ steps.version.outputs.version }}
            RELEASE_CHANNEL=${{ steps.version.outputs.channel }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Wait before retry 2 (AMD64)
        if: steps.build.outcome == 'failure' && steps.build_retry1.outcome == 'failure'
        run: |
          echo "::warning::Build/push attempt 2 failed. Sleeping 60s before final retry."
          sleep 60

      - name: Build and push (AMD64) — retry 2
        id: build_retry2
        if: steps.build.outcome == 'failure' && steps.build_retry1.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            ECM_VERSION=${{ steps.version.outputs.version }}
            RELEASE_CHANNEL=${{ steps.version.outputs.channel }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Capture digest (AMD64)
        id: digest
        run: |
          # Pick the digest from whichever attempt actually succeeded.
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then DIGEST="${{ steps.build_retry1.outputs.digest }}"; fi
          if [ -z "$DIGEST" ]; then DIGEST="${{ steps.build_retry2.outputs.digest }}"; fi
          if [ -z "$DIGEST" ]; then
            echo "::error::No digest produced by any build attempt"
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

