    needs: [security-scan-backend, security-scan-mcp, wait-for-tests]
    if: >-
      always() && needs.wait-for-tests.result == 'success'
      && (github.event_name != 'pull_request' || !contains(needs.*.result, 'failure'))
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      image: ${{ steps.image.outputs.name }}

    steps:
