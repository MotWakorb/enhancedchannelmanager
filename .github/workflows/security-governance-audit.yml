name: Security Governance Audit

# ─── Credential model ──────────────────────────────────────────────────────
# Four of the six controls this audit reads are repository ADMINISTRATION
# surfaces, and the built-in GITHUB_TOKEN can never reach them: the workflow
# `permissions:` key has no `administration` scope at all, so there is no
# setting that would grant it. GitHub also documents that `security-events`
# covers code scanning only, and that secret-scanning alerts "cannot be read
# with this permission and require a GitHub App or a personal access token".
# Before this wiring existed the audit failed in ~2s on every dev push with
# `gh: Resource not accessible by integration (HTTP 403)`.
#
# So the elevated reads run on GOVERNANCE_AUDIT_TOKEN, a repository secret
# holding a read-only fine-grained PAT scoped to this repository only. The one
# call the built-in token CAN serve (reading a branch ref, which needs only
# `contents: read`) deliberately stays on `github.token`: the elevated
# credential is used where GitHub's permission model requires it, and nowhere
# else. There is no fallback from one to the other in either direction, and no
# swallowed exit code anywhere below, because a credential that silently
# degrades to "nothing to report" is worse than an audit that does not run.
#
# ─── Cadence arming ────────────────────────────────────────────────────────
# GitHub registers `schedule:` and `workflow_dispatch:` triggers only for a
# workflow file present on the repository's DEFAULT branch (`main`). This file
# lives on `dev`, so today
# `gh api repos/<owner>/<repo>/actions/workflows/security-governance-audit.yml`
# answers 404 and BOTH of those triggers are inert. They arm by themselves,
# with no edit to this file, the moment it reaches `main` at the next release
# cut. Until then the only path that executes this audit is the `workflow_call`
# from `.github/workflows/test.yml` on every `dev` push.
#
# The final step probes the default branch for this file on every run and
# reports ARMED or PENDING, so presence on the default branch is checked
# rather than assumed. That presence is what GitHub requires before it
# registers the triggers; the probe does not read back the registered
# triggers themselves, and does not validate the cron expression.
# Cadence ownership, quarterly disposition, and the evidence trail live in
# `docs/security/release-security-governance.md`.

on:
  workflow_call:
    secrets:
      GOVERNANCE_AUDIT_TOKEN:
        description: >-
          Read-only fine-grained personal access token, scoped to this
          repository only, granting Administration (read) for branch
          protection, Dependabot alert enablement and automated security
          fixes, and Secret scanning alerts (read). See the credential-model
          note at the top of this file for why the built-in GITHUB_TOKEN
          cannot substitute.
        required: true
  schedule:
    # 09:00 America/Chicago standard time on the first day of each quarter.
    # Inert until this file reaches the default branch; see "Cadence arming".
    - cron: "0 15 1 1,4,7,10 *"
  workflow_dispatch:

# Exactly what the `github.token`-served calls need, and nothing more: reading
# the `beads` branch ref and probing the default branch for this workflow file
# are both `contents: read`. `security-events: read` is deliberately absent.
# Nothing here reads code-scanning alerts, and that scope does not grant
# secret-scanning access, so leaving it granted would widen the token for no
# call that uses it.
permissions:
  contents: read

jobs:
  audit:
    name: Release and Dependency Control Audit
    runs-on: ubuntu-latest
    steps:
      - name: Verify the elevated audit credential is present
        env:
          GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          # A secret that is declared but never provisioned expands to the
          # EMPTY STRING here, not to an unset variable, so `set -u` never
          # fires and every `gh` call below would run unauthenticated. This
          # explicit emptiness test is the only thing between a missing
          # credential and an audit that reports "nothing to report". Fail
          # closed, and name the secret so the message is actionable.
          if [[ -z "${GOVERNANCE_AUDIT_TOKEN:-}" ]]; then
            # Keep credential keywords out of colon-prefix position anywhere
            # in this body, in prose as well as in code. GitHub Actions YAML
            # collapses the whole `run:` block onto one logical line for
            # scanners, and detect-secrets' KeywordDetector then reads a
            # keyword immediately followed by a colon and a word as a keyed
            # assignment, failing the repository's secret ratchet on a message
            # that contains no credential at all. Write "the one-entry secrets
            # mapping", never the same phrase with a colon after the keyword.
            echo "::error::GOVERNANCE_AUDIT_TOKEN is absent or empty, so this audit cannot read any repository control and will not pretend otherwise. Provision a repository secret named GOVERNANCE_AUDIT_TOKEN holding a read-only fine-grained personal access token scoped to this repository only, granting Administration (read) and Secret scanning alerts (read). If this run came from .github/workflows/test.yml, also confirm that caller still passes the credential through its explicit one-entry secrets mapping."
            exit 1
          fi
          echo "GOVERNANCE_AUDIT_TOKEN is present."

      - name: Verify repository controls that require the elevated credential
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Four outcomes have to stay distinguishable, because they have
          # four different owners: a missing credential (handled by the step
          # above), an EXPIRED or revoked credential, an UNDER-SCOPED
          # credential — both provisioning defects that must never be reported
          # as control violations — and a genuine control violation, which is
          # a security finding. GitHub answers an invalid or expired token
          # with 401, an under-scoped fine-grained PAT with 403, and a 404 on
          # these endpoints usually means the control itself is off. 404 is
          # also what GitHub returns when a token cannot see the resource at
          # all, so every 404 message names both possibilities rather than
          # flatly asserting the control is disabled.
          #
          # Every call captures its own exit status and re-raises it. Nothing
          # below defaults a failed read to an empty result.
          credential_error() {
            echo "::error::GOVERNANCE_AUDIT_TOKEN was rejected (HTTP 401, bad credentials) by $1. The token itself is no longer valid: it has expired, been revoked, or been stored with a typo. Reissue a read-only fine-grained personal access token scoped to this repository only and replace the GOVERNANCE_AUDIT_TOKEN repository secret with it. This is a credential-provisioning defect, not a finding about the control itself."
          }

          scope_error() {
            echo "::error::GOVERNANCE_AUDIT_TOKEN was refused (HTTP 403) by $1. Grant the token '$2' (read) on this repository. This is a credential-provisioning defect, not a finding about the control itself."
          }

          read_protection() {
            local branch="$1" endpoint="$2" status=0
            gh api "$endpoint" > "$branch-protection.json" 2> gh-error.txt || status=$?
            if [[ "$status" -ne 0 ]]; then
              if grep -q 'HTTP 401' gh-error.txt; then
                credential_error "$endpoint"
              elif grep -q 'HTTP 403' gh-error.txt; then
                scope_error "$endpoint" "Administration"
              elif grep -q 'HTTP 404' gh-error.txt; then
                echo "::error::Branch '$branch' reports no protection settings at all (HTTP 404 from $endpoint). Restore branch protection on '$branch'. If protection IS configured, then GOVERNANCE_AUDIT_TOKEN has lost 'Administration' (read) instead."
              else
                echo "::error::Reading $endpoint failed."
              fi
              cat gh-error.txt >&2
              exit 1
            fi
          }

          # Branch protection. Requires Administration (read); this is the
          # exact call that returned 403 under the built-in token.
          read_protection main "repos/$REPO/branches/main/protection"
          read_protection dev "repos/$REPO/branches/dev/protection"

          # Each assertion re-raises its own status and names what failed.
          # A bare `jq -e` would fail the job only through `set -e`, and would
          # print an unannotated `false` that says nothing about which control
          # is weak on which branch.
          check_enforcement() {
            local branch="$1"
            if ! jq -e '.enforce_admins.enabled == true and .allow_force_pushes.enabled == false' \
              "$branch-protection.json" >/dev/null; then
              echo "::error::Branch protection on '$branch' is weaker than the release contract requires: administrator enforcement must be ON and force pushes must be OFF. Currently enforce_admins.enabled=$(jq -c '.enforce_admins.enabled' "$branch-protection.json") and allow_force_pushes.enabled=$(jq -c '.allow_force_pushes.enabled' "$branch-protection.json")."
              exit 1
            fi
          }

          check_required_contexts() {
            local branch="$1" required="$2"
            if ! jq -e --argjson required "$required" \
              '(.required_status_checks.contexts // []) as $actual | all($required[]; IN($actual[]))' \
              "$branch-protection.json" >/dev/null; then
              echo "::error::Branch '$branch' is missing at least one required status check. The release contract requires $required; the branch currently requires $(jq -c '.required_status_checks.contexts // []' "$branch-protection.json")."
              exit 1
            fi
          }

          check_enforcement main
          check_enforcement dev

          required_main='["Backend Tests","Frontend Tests","CodeQL Analysis (python)","CodeQL Analysis (javascript-typescript)","Release Cut Gate"]'
          required_dev='["Backend Tests","Frontend Tests","CodeQL Analysis (python)","CodeQL Analysis (javascript-typescript)","Build Docker Image (AMD64)","DAST Security Scan","Container Security Scan (Trivy)"]'
          check_required_contexts main "$required_main"
          check_required_contexts dev "$required_dev"

          # Dependabot alert enablement. Requires Administration (read).
          # 204 means enabled, 404 means disabled.
          status=0
          gh api "repos/$REPO/vulnerability-alerts" >/dev/null 2> gh-error.txt || status=$?
          if [[ "$status" -ne 0 ]]; then
            if grep -q 'HTTP 401' gh-error.txt; then
              credential_error "repos/$REPO/vulnerability-alerts"
            elif grep -q 'HTTP 403' gh-error.txt; then
              scope_error "repos/$REPO/vulnerability-alerts" "Administration"
            elif grep -q 'HTTP 404' gh-error.txt; then
              echo "::error::Dependabot alerts read as DISABLED for this repository (HTTP 404 from repos/$REPO/vulnerability-alerts). Re-enable them under Settings, Code security. If they ARE enabled, then GOVERNANCE_AUDIT_TOKEN has lost 'Administration' (read) instead: GitHub answers this endpoint with 404 both when the control is off and when the credential cannot see it."
            else
              echo "::error::Reading repos/$REPO/vulnerability-alerts failed."
            fi
            cat gh-error.txt >&2
            exit 1
          fi

          # Automated security fixes. Requires Administration (read).
          # 200 carries {"enabled": bool, "paused": bool}; 404 means the
          # service is not available on this repository at all.
          status=0
          gh api "repos/$REPO/automated-security-fixes" \
            > automated-security-fixes.json 2> gh-error.txt || status=$?
          if [[ "$status" -ne 0 ]]; then
            if grep -q 'HTTP 401' gh-error.txt; then
              credential_error "repos/$REPO/automated-security-fixes"
            elif grep -q 'HTTP 403' gh-error.txt; then
              scope_error "repos/$REPO/automated-security-fixes" "Administration"
            elif grep -q 'HTTP 404' gh-error.txt; then
              echo "::error::Dependabot security updates read as unavailable for this repository (HTTP 404 from repos/$REPO/automated-security-fixes). Re-enable them under Settings, Code security. If they ARE available, then GOVERNANCE_AUDIT_TOKEN has lost 'Administration' (read) instead: GitHub answers this endpoint with 404 both when the service is off and when the credential cannot see it."
            else
              echo "::error::Reading repos/$REPO/automated-security-fixes failed."
            fi
            cat gh-error.txt >&2
            exit 1
          fi
          # `paused` is a SEPARATE field from `enabled`, and GitHub sets it by
          # itself on repositories whose Dependabot PRs go unactioned. A paused
          # service reports `enabled: true` while opening no security-update
          # PRs at all, so asserting only on `enabled` is a vacuous pass.
          # Resuming and re-enabling are different operator actions, so they
          # get different messages.
          if ! jq -e '.enabled == true' automated-security-fixes.json >/dev/null; then
            echo "::error::Dependabot security updates are switched off. Re-enable them under Settings, Code security. repos/$REPO/automated-security-fixes reports: $(cat automated-security-fixes.json)"
            exit 1
          fi
          if ! jq -e '.paused == false' automated-security-fixes.json >/dev/null; then
            echo "::error::Dependabot security updates are enabled but PAUSED, so no security-update pull requests are being opened. GitHub pauses them automatically when its update pull requests go unactioned. Resume them under Settings, Code security, and disposition the outstanding Dependabot pull requests. repos/$REPO/automated-security-fixes reports: $(cat automated-security-fixes.json)"
            exit 1
          fi

          # Secret-scanning alerts. Requires Secret scanning alerts (read);
          # the GITHUB_TOKEN cannot read these under any `permissions:` value.
          # 404 here means secret scanning itself is off, which is a control
          # violation rather than a clean board.
          #
          # THIS REPOSITORY IS PUBLIC, so Actions logs are world-readable and
          # the failure path below writes this file to the log. The alert
          # objects carry a plaintext `.secret` field holding the leaked
          # credential itself, which Actions would NOT redact because it is not
          # a registered Actions secret. The projection therefore emits only
          # the alert number, the detector name and the timestamp. Never widen
          # it to `.[]` and never add `.secret`; `.secret_type` is the
          # detector name and is safe.
          status=0
          gh api --paginate "repos/$REPO/secret-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | "#\(.number) \(.secret_type) opened \(.created_at)"' \
            > open-secret-alerts.txt 2> gh-error.txt || status=$?
          if [[ "$status" -ne 0 ]]; then
            if grep -q 'HTTP 401' gh-error.txt; then
              credential_error "repos/$REPO/secret-scanning/alerts"
            elif grep -q 'HTTP 403' gh-error.txt; then
              scope_error "repos/$REPO/secret-scanning/alerts" "Secret scanning alerts"
            elif grep -q 'HTTP 404' gh-error.txt; then
              echo "::error::Secret scanning reads as DISABLED for this repository (HTTP 404 from repos/$REPO/secret-scanning/alerts). An unreadable alert list is not an empty alert list. Re-enable secret scanning under Settings, Code security. If it IS enabled, then GOVERNANCE_AUDIT_TOKEN has lost 'Secret scanning alerts' (read) instead: GitHub documents this endpoint as answering 404 both when the feature is off and when the credential cannot see it."
            else
              echo "::error::Reading repos/$REPO/secret-scanning/alerts failed."
            fi
            cat gh-error.txt >&2
            exit 1
          fi
          # Emptiness, not a line count: `wc -l` counts newlines, so an alert
          # list whose last line lacks a trailing newline would undercount and
          # a single-alert board could report clean. `-s` is invariant under
          # that. The count in the message uses `grep -c ''`, which does count
          # a final unterminated line.
          if [[ -s open-secret-alerts.txt ]]; then
            echo "::error::$(grep -c '' open-secret-alerts.txt) secret-scanning alert(s) remain undispositioned"
            cat open-secret-alerts.txt >&2
            exit 1
          fi

      - name: Verify the authoritative beads branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Reading a branch ref needs only `contents: read`, which the
          # built-in token has. This check therefore does NOT use
          # GOVERNANCE_AUDIT_TOKEN, and must not start doing so.
          status=0
          gh api "repos/$REPO/branches/beads" >/dev/null 2> gh-error.txt || status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::error::The authoritative 'beads' branch could not be read from repos/$REPO/branches/beads. The release gate fails closed while that remote branch is absent; publish the current board export with 'bd sync'."
            cat gh-error.txt >&2
            exit 1
          fi

      - name: Record audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUDIT_WORKFLOW_PATH: .github/workflows/security-governance-audit.yml
        run: |
          set -euo pipefail

          # Whether the quarterly cadence is actually armed is a fact about
          # the default branch, so read it instead of asserting it. Present on
          # the default branch means GitHub has registered the `schedule:` and
          # `workflow_dispatch:` triggers; absent means only the
          # `workflow_call` path from test.yml can run this audit. Absent is
          # the expected state until the next release cut, so it is reported,
          # not failed. Anything that is neither present nor a clean 404 is a
          # broken probe and does fail: a probe that cannot tell the two apart
          # would report PENDING forever.
          branch="${DEFAULT_BRANCH:-main}"
          status=0
          gh api "repos/$REPO/contents/$AUDIT_WORKFLOW_PATH?ref=$branch" \
            >/dev/null 2> gh-error.txt || status=$?
          # What is CHECKED is presence of this file on the default branch,
          # not registration of the triggers themselves. Presence is the
          # necessary condition GitHub documents, but a file that reached
          # '$branch' with its `schedule:` block deleted or its cron malformed
          # would still be present. Reading `repos/$REPO/actions/workflows/...`
          # instead would need an `actions: read` grant that nothing else here
          # uses, and it still would not validate the cron, so the state is
          # named for the check that actually ran rather than for the
          # conclusion. `docs/security/release-security-governance.md` records
          # the same distinction.
          if [[ "$status" -eq 0 ]]; then
            cadence="ARMED (checked: this file is present on '$branch', which is what GitHub requires before it registers the quarterly schedule and the manual dispatch button; the cron expression itself is not validated here)"
          elif grep -q 'HTTP 404' gh-error.txt; then
            cadence="PENDING (checked: this file is not on '$branch' yet, so the quarterly schedule and manual dispatch are inert; they arm at the next release cut with no edit to the workflow). The dev-push workflow_call from .github/workflows/test.yml is the only path running this audit today."
            echo "::warning::Quarterly security-governance cadence is PENDING: $AUDIT_WORKFLOW_PATH is not on the default branch '$branch' yet, so its schedule and workflow_dispatch triggers are inert. See docs/security/release-security-governance.md."
          else
            echo "::error::Could not determine whether the quarterly cadence is armed: probing repos/$REPO/contents/$AUDIT_WORKFLOW_PATH?ref=$branch failed for a reason other than a clean 404."
            cat gh-error.txt >&2
            exit 1
          fi

          # These four control lines are string literals, not values carried
          # over from the steps that did the reading. They are true only
          # because each earlier step exits non-zero on any violation and
          # GitHub aborts the job, so this step running at all is what they
          # restate: the job got this far. The authority for any individual
          # control is that step's own log and its ::error:: annotations, not
          # this summary.
          {
            echo "## Quarterly security governance audit"
            echo "- UTC time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Commit audited: $GITHUB_SHA"
            echo "- The four lines below restate that every earlier step"
            echo "  passed; each step fails the job outright otherwise."
            echo "- Branch protection contract: verified"
            echo "- Authoritative beads branch: available"
            echo "- Dependency alerts and automated fixes: enabled and not paused"
            echo "- Open secret-scanning alerts: zero"
            echo "- Elevated reads used GOVERNANCE_AUDIT_TOKEN; the beads-branch"
            echo "  read and this cadence probe used the built-in GITHUB_TOKEN."
            echo "- Scheduled cadence: $cadence"
            echo "- Cadence owner and disposition process:"
            echo "  docs/security/release-security-governance.md"
          } >> "$GITHUB_STEP_SUMMARY"
