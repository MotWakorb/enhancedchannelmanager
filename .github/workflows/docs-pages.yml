name: Docs — Build & Deploy to Pages

# The `paths:` filter that used to sit on the push trigger is gone. It carried
# a second copy of "what the published site is built from", which drifted from
# the copy nothing else could see. That list now lives in
# scripts/classify_changed_paths.py as the `docs_site_affected` verdict, and
# the `build` job below gates on it. See bead enhancedchannelmanager-t4d5w.
#
# Neither job here emits a branch-protection required status check, so gating
# at the JOB level is safe. Do not copy this shape into test.yml or build.yml:
# there, a skipped job satisfies a required check without running anything.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  # Mirrors the `detect` job in test.yml and build.yml, and calls the same
  # classifier, so the site's path list has exactly one definition.
  detect:
    name: Detect Changed Paths (Docs Site)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code_paths_changed: ${{ steps.classify.outputs.code_paths_changed }}
      docs_site_affected: ${{ steps.classify.outputs.docs_site_affected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Only scripts/classify_changed_paths.py is needed; the changed-file
          # set comes from the compare API, not from git history.
          fetch-depth: 1

      - name: Classify the changed file set
        id: classify
        uses: ./.github/actions/classify-changed-paths

  build:
    needs: [detect]
    # Two guards, and both directions matter.
    #
    # `!= 'false'` covers an absent or empty output: the site rebuilds unless
    # the classifier positively said it need not.
    #
    # `!cancelled()` covers a `detect` job that FAILED. A job-level `if:` with
    # no status function carries an implicit `success()` over its `needs`, so
    # without this a failed `detect` would skip `build`, skip `deploy`, and
    # leave the published site silently behind merged content until the next
    # site-affecting push happened to heal it. That is the direction this
    # output is designed to fail away from. Same reasoning, same shape as
    # `codeql-analysis` in build.yml, which carries `!cancelled()` for the
    # mirror-image reason.
    if: >-
      !cancelled()
      && needs.detect.outputs.docs_site_affected != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install docs dependencies
        run: pip install -r docs/requirements-docs.txt
      - name: Build site (strict)
        run: mkdocs build --strict --site-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Skips automatically when `build` skips, so a non-site change deploys
    # nothing and the last published site stands.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
