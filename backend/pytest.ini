[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage settings.
# Pragmatic baseline ratchet (bead enhancedchannelmanager-nmlxi, measured 2026-04-20).
# Full-suite measurement on dev tip (--ignore=tests/e2e -m "not slow", source=.,
# tests/alembic/conftest excluded): TOTAL line coverage = 58%.
# --cov-fail-under=56 = measured − 2 (regression guard).
# Re-ratchet cadence + policy: docs/testing.md § "Coverage ratchet cadence".
# DO NOT lower without PO approval.
#
# Coverage is enabled by default here. Pass --no-cov to override locally for
# debugging when full-suite coverage gets in the way of a single-file run.
#
# tests/e2e mutates the live ECM on localhost:6100, so a bare `pytest` must not
# walk into it. --ignore does not apply to a path named on the command line, so
# `scripts/backend-gate.sh --subset --allow-live-e2e tests/e2e` still reaches it.
addopts =
    --ignore=tests/e2e
    --strict-markers
    -ra
    -q
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=56

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use database)
    slow: Slow tests (skip with -m "not slow")
    benchmark: pytest-benchmark perf tests (bd-skqln.10) — excluded from the
        default suite; run with ``python -m pytest tests/performance/
        --benchmark-only`` or via the perf-benchmarks CI workflow.

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging
log_cli = false
log_cli_level = WARNING
